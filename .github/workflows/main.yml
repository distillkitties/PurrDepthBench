name: PurrDepthBench – llama.cpp mmap Test (Corrected URLs)

on:
  workflow_dispatch:

jobs:
  mmap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      matrix:
        size: [2b, 4b, 9b, 27b]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal Python dependencies inline
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Install build tools and clone llama.cpp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git cmake ninja-build wget curl

      - name: Clone and build llama.cpp server
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DLLAMA_BUILD_SERVER=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j
          cp build/bin/llama-server ../llama-server
          cd ..

      - name: Show initial memory
        run: free -h

      - name: Download GGUF Q4_K_M with robust fallbacks for ${{ matrix.size }}
        run: |
          case "${{ matrix.size }}" in
            2b)
              REPO="Jackrong/Qwen3.5-2B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="Qwen3.5-2B.Q4_K_M.gguf"
              ;;
            4b)
              REPO="Jackrong/Qwen3.5-4B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="Qwen3.5-4B.Q4_K_M.gguf"
              ;;
            9b)
              REPO="Jackrong/Qwen3.5-9B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="Qwen3.5-9B.Q4_K_M.gguf"
              ;;
            27b)
              REPO="Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="Qwen3.5-27B.Q4_K_M.gguf"
              ;;
          esac

          echo "=== Downloading $FILE from $REPO ==="

          # 1. curl (primary, with resume and progress)
          curl -L -C - --progress-bar -o "$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE" && \
            [ -s "$FILE" ] && echo "curl success" && mv "$FILE" model.gguf && exit 0 || echo "curl failed"

          # 2. wget fallback
          wget --continue --progress=bar "https://huggingface.co/$REPO/resolve/main/$FILE" -O "$FILE" && \
            [ -s "$FILE" ] && echo "wget success" && mv "$FILE" model.gguf && exit 0 || echo "wget failed"

          echo "!!! ALL DOWNLOAD METHODS FAILED for ${{ matrix.size }} !!!"
          exit 1

      - name: Show memory after download
        run: free -h

      - name: Start llama.cpp server with explicit mmap
        run: |
          ./llama-server \
            --model model.gguf \
            --host 0.0.0.0 \
            --port 8080 \
            --ctx-size 2048 \
            --mmap \
            --n-gpu-layers 0 &  # CPU only
          sleep 60 || echo "Server start timed out"

      - name: Test inference with simple prompt
        run: |
          curl http://127.0.0.1:8080/v1/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "model.gguf",
              "prompt": "Hello! Tell me a short joke.",
              "max_tokens": 50,
              "temperature": 0.7
            }' || echo "Inference failed (likely paging/OOM)"

      - name: Show final memory status
        run: free -h || true

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmap-test-${{ matrix.size }}
          path: |
            ./*.log
            ./*.txt
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: mmap-test
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## llama.cpp mmap Test Summary (no swap)" >> summary.md
          echo "" >> summary.md
          echo "Tested sizes:" >> summary.md
          echo "- 2B" >> summary.md
          echo "- 4B" >> summary.md
          echo "- 9B" >> summary.md
          echo "- 27B" >> summary.md
          echo "" >> summary.md
          echo "Results:" >> summary.md
          for s in 2b 4b 9b 27b; do
            echo "- $s: $( [ -d "artifacts/mmap-test-$s" ] && echo 'OK' || echo 'Failed')" >> summary.md
          done
          echo "" >> summary.md
          echo "Full logs in artifacts." >> summary.md
          cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: mmap-summary
          path: summary.md
