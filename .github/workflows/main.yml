name: PurrDepthBench – llama.cpp mmap + fallbacks (Qwopus 2B/4B/9B/27B)

on:
  workflow_dispatch:

jobs:
  test-llamacpp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true  # allows retry attempts

    strategy:
      matrix:
        size: [2b, 4b, 9b, 27b]
        attempt: [1, 2, 3]  # retry up to 3 times

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal Python dependencies inline
        run: |
          python -m pip install --upgrade pip
          pip install openai huggingface_hub[hf_transfer]

      - name: Install build tools and clone llama.cpp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git cmake ninja-build wget curl unzip
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DLLAMA_BUILD_SERVER=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j
          cp build/bin/llama-server ../llama-server
          cd ..

      - name: Show initial memory
        run: free -h

      - name: Download GGUF Q4_K_M with fallbacks for ${{ matrix.size }}
        run: |
          REPO=""
          FILE=""
          case "${{ matrix.size }}" in
            2b)
              REPO="Jackrong/Qwen3.5-2B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="qwen3.5-2b-claude-4.6-opus-reasoning-distilled-q4_k_m.gguf"
              ;;
            4b)
              REPO="Jackrong/Qwen3.5-4B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="qwen3.5-4b-claude-4.6-opus-reasoning-distilled-q4_k_m.gguf"
              ;;
            9b)
              REPO="Jackrong/Qwen3.5-9B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="qwen3.5-9b-claude-4.6-opus-reasoning-distilled-q4_k_m.gguf"
              ;;
            27b)
              REPO="Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
              FILE="qwen3.5-27b-claude-4.6-opus-reasoning-distilled-q4_k_m.gguf"
              ;;
          esac

          echo "Trying HF CLI + hf_transfer first..."
          HF_HUB_ENABLE_HF_TRANSFER=1 huggingface-cli download "$REPO" "$FILE" --local-dir . --local-dir-use-symlinks False || echo "HF CLI failed"

          if [ ! -f "$FILE" ]; then
            echo "Fallback to curl with resume..."
            curl -L -C - -o "$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE" || echo "curl failed"
          fi

          if [ ! -f "$FILE" ]; then
            echo "Last fallback: wget"
            wget -O "$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE" || echo "wget failed"
          fi

          if [ -f "$FILE" ]; then
            mv "$FILE" model.gguf
            echo "Download succeeded"
          else
            echo "All download methods failed for ${{ matrix.size }}"
            exit 1
          fi

      - name: Show memory after download
        run: free -h

      - name: Start llama.cpp server with mmap
        run: |
          ./llama-server \
            --model model.gguf \
            --host 0.0.0.0 \
            --port 8080 \
            --ctx-size 2048 \
            --mmap \
            --n-gpu-layers 0 &  # CPU only
          sleep 60 || echo "Server start timed out or failed"

      - name: Run benchmark (attempt ${{ matrix.attempt }})
        env:
          MODEL_NAME: qwen3.5:${{ matrix.size }}-claude-4.6-opus-reasoning-distilled
        run: python benchmark.py || echo "Benchmark failed - retrying if attempts remain"

      - name: Upload logs for ${{ matrix.size }} attempt ${{ matrix.attempt }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.size }}-attempt-${{ matrix.attempt }}
          path: ./*.log ./*.txt
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: test-llamacpp
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## llama.cpp mmap Results (no swap, with retries)" >> summary.md
          echo "" >> summary.md
          echo "Tested variants:" >> summary.md
          echo "- 2B" >> summary.md
          echo "- 4B" >> summary.md
          echo "- 9B" >> summary.md
          echo "- 27B" >> summary.md
          echo "" >> summary.md
          echo "Success status (at least one successful attempt):" >> summary.md
          for s in 2b 4b 9b 27b; do
            if ls artifacts/logs-$s-attempt-* 1> /dev/null 2>&1; then
              echo "- $s: ✅ Succeeded" >> summary.md
            else
              echo "- $s: ❌ Failed all attempts" >> summary.md
            fi
          done
          echo "" >> summary.md
          echo "Full logs in artifacts." >> summary.md
          cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: mmap-summary
          path: summary.md
