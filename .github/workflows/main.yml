name: Test llama.cpp mmap (no swap)

on:
  workflow_dispatch:

jobs:
  mmap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git cmake ninja-build wget

      - name: Clone and build llama.cpp server
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DLLAMA_BUILD_SERVER=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j
          cp build/bin/llama-server ../llama-server
          cd ..

      - name: Show initial memory (before any model)
        run: free -h

      - name: Download small GGUF (~2 GB, should fit in RAM)
        run: |
          wget -O small.gguf https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

      - name: Start server with small model + mmap
        run: |
          ./llama-server \
            --model small.gguf \
            --host 0.0.0.0 \
            --port 8080 \
            --ctx-size 2048 \
            --mmap \
            --n-gpu-layers 0 &  # CPU only, mmap on
          sleep 30

      - name: Test small model inference
        run: |
          curl http://127.0.0.1:8080/v1/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "small.gguf",
              "prompt": "Hello! Tell me a short joke.",
              "max_tokens": 50,
              "temperature": 0.7
            }' || echo "Small inference failed"

      - name: Show memory after small model
        run: free -h

      - name: Download medium-large GGUF (~10–12 GB, pushes 14 GB RAM limit)
        run: |
          wget -O large.gguf https://huggingface.co/TheBloke/Llama-2-13B-chat-GGUF/resolve/main/llama-2-13b-chat.Q4_K_M.gguf || echo "Download failed (file too big or not found)"

      - name: Try to start server with large model + mmap
        run: |
          ./llama-server \
            --model large.gguf \
            --host 0.0.0.0 \
            --port 8080 \
            --ctx-size 2048 \
            --mmap \
            --n-gpu-layers 0 &  # CPU only, mmap on
          sleep 60 || echo "Large model server start timed out or failed"

      - name: Test large model inference (expect slow or fail)
        run: |
          curl http://127.0.0.1:8080/v1/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "large.gguf",
              "prompt": "Hello! Tell me a short joke.",
              "max_tokens": 50,
              "temperature": 0.7
            }' || echo "Large inference failed (expected due to paging/OOM)"

      - name: Final memory status
        run: free -h || true

      - name: Upload logs & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmap-test-results
          path: ./*.log ./*.txt ./*.gguf
          retention-days: 7
