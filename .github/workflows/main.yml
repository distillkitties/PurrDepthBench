name: PurrDepthBench – All Qwopus Variants (2B/4B/9B/27B)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-qwopus:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        variant:
          - qwen3.5:2b-claude-4.6-opus-reasoning-distilled
          - qwen3.5:4b-claude-4.6-opus-reasoning-distilled
          - qwen3.5:9b-claude-4.6-opus-reasoning-distilled
          - qwen3.5:27b-claude-4.6-opus-reasoning-distilled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal Python dependencies inline
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10

      - name: Pull Qwopus variant ${{ matrix.variant }}
        run: ollama pull ${{ matrix.variant }}

      - name: Run benchmark for ${{ matrix.variant }}
        env:
          MODEL_NAME: ${{ matrix.variant }}
        run: python benchmark.py

      - name: Upload logs for ${{ matrix.variant }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.variant }}
          path: |
            **/*.log
            **/*.txt
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: test-qwopus
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary of completed variants
        run: |
          echo "## PurrDepthBench Qwopus Variants Run Summary" >> summary.md
          echo "" >> summary.md
          echo "Tested in parallel:" >> summary.md
          echo "- 2B" >> summary.md
          echo "- 4B" >> summary.md
          echo "- 9B" >> summary.md
          echo "- 27B" >> summary.md
          echo "" >> summary.md
          echo "### Completed Successfully:" >> summary.md
          for size in 2b 4b 9b 27b; do
            if [ -d "artifacts/logs-qwen3.5:${size}-claude-4.6-opus-reasoning-distilled" ] && [ -n "$(ls artifacts/logs-qwen3.5:${size}-claude-4.6-opus-reasoning-distilled 2>/dev/null)" ]; then
              echo "- ✅ qwen3.5:${size}-claude-4.6-opus-reasoning-distilled" >> summary.md
            else
              echo "- ❌ qwen3.5:${size}-claude-4.6-opus-reasoning-distilled (failed or no logs)" >> summary.md
            fi
          done
          echo "" >> summary.md
          echo "Full logs attached as artifacts for each variant." >> summary.md

      - name: Show summary in job output
        run: cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: qwopus-run-summary
          path: summary.md
